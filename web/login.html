<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FRP 管理面板 · 登录</title><link rel="stylesheet" href="/assets/app.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="brand-mark">F</div><p class="eyebrow">FRP CONTROL PLANE</p>
    <h1>登录管理面板</h1>
    <form id="login-form">
      <label>用户名<input name="username" autocomplete="username" required autofocus></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="error" role="alert"></p>
      <button class="primary-button" type="submit">登录</button>
    </form>
  </main>
  <script src="/assets/theme.js"></script>
  <script>
    fetch('/api/me').then(response => { if (response.ok) return response.json(); throw new Error('not authenticated'); }).then(user => location.replace(user.mustChange ? '/account.html' : '/')).catch(() => {});
    document.querySelector('#login-form').addEventListener('submit', async event => {
      event.preventDefault(); const form = new FormData(event.currentTarget);
      const response = await fetch('/api/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.get('username'),password:form.get('password')})});
      if (response.ok) { const me=await fetch('/api/me').then(result=>result.json()); location.href=me.mustChange?'/account.html':'/'; } else document.querySelector('#error').textContent='用户名或密码错误';
    });
  </script>
</body>
</html>
