<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修改临时密码 · FRP 管理面板</title><link rel="stylesheet" href="/assets/app.css"></head>
<body class="login-page"><main class="login-shell"><div class="brand-mark">F</div><p class="eyebrow">PASSWORD UPDATE REQUIRED</p><h1>设置新密码</h1><p class="subheading">首次登录需要先修改管理员临时密码。</p><form id="first-password-form"><label>新密码（至少 8 位）<input id="new-password" type="password" minlength="8" autocomplete="new-password" required autofocus></label><label>确认新密码<input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required></label><p class="form-error" id="error" role="alert"></p><button class="primary-button" type="submit">更新密码</button></form></main><script src="/assets/theme.js"></script><script src="/assets/account.js"></script></body>
